{% extends "admin/base_admin.html" %}
{% block page_title %}User Management{% endblock %}
{% block content %}
<div class="glass-card fade-up">
  <div class="table-wrap">
  <table>
    <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Action</th></tr></thead>
    <tbody>
    {% for u in users %}
      <tr>
        <td>{{ u.full_name }}</td>
        <td>{{ u.email }}</td>
        <td style="text-transform:capitalize;">{{ u.role }}</td>
        <td>{% if u.is_active %}<span class="badge badge-success">Active</span>{% else %}<span class="badge badge-danger">Inactive</span>{% endif %}</td>
        <td>
          <form method="POST" action="{{ url_for('admin.toggle_user_active', user_id=u.id) }}">
            <button class="btn btn-outline btn-sm" type="submit">{{ 'Deactivate' if u.is_active else 'Activate' }}</button>
          </form>
        </td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
  </div>
</div>
{% endblock %}
