{% extends "admin/base_admin.html" %}
{% block page_title %}KYC Management{% endblock %}
{% block content %}
<div class="glass-card fade-up">
  <div class="table-wrap">
  <table>
    <thead><tr><th>Customer</th><th>PAN</th><th>Status</th><th>Notes</th></tr></thead>
    <tbody>
    {% for c in customers %}
      <tr>
        <td>{{ c.user.full_name }}</td>
        <td>{{ c.pan_number or '-' }}</td>
        <td><span class="badge {{ 'badge-success' if c.kyc_status=='verified' else ('badge-danger' if c.kyc_status=='rejected' else 'badge-warning') }}">{{ c.kyc_status|title }}</span></td>
        <td class="text-muted">{{ c.kyc_notes or '-' }}</td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
  </div>
</div>
{% endblock %}
