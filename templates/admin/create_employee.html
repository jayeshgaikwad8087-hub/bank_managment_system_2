{% extends "admin/base_admin.html" %}
{% block page_title %}Add Employee{% endblock %}
{% block content %}
<div class="glass-card fade-up" style="max-width:480px;">
  <form method="POST">
    <div class="form-group"><label>Full Name</label><input type="text" name="full_name" required></div>
    <div class="grid grid-2">
      <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
      <div class="form-group"><label>Phone</label><input type="tel" name="phone" required></div>
    </div>
    <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
    <div class="grid grid-2">
      <div class="form-group"><label>Employee Code</label><input type="text" name="employee_code" required></div>
      <div class="form-group"><label>Department</label><input type="text" name="department" value="Retail Banking"></div>
    </div>
    <div class="form-group"><label>Branch</label><input type="text" name="branch" value="Main Branch"></div>
    <button class="btn btn-primary btn-block" type="submit">Create Employee Account</button>
  </form>
</div>
{% endblock %}
