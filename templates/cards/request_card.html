{% extends "customer/base_customer.html" %}
{% block page_title %}Request Card{% endblock %}
{% block content %}
<div class="glass-card fade-up" style="max-width:420px;">
  <form method="POST">
    <div class="form-group">
      <label>Linked Account</label>
      <select name="account_id" required>
        {% for a in accounts %}<option value="{{ a.id }}">{{ a.masked_number() }}</option>{% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>Card Type</label>
      <select name="card_type">
        <option value="debit">Debit Card</option>
        <option value="credit">Credit Card</option>
      </select>
    </div>
    <button class="btn btn-primary btn-block" type="submit">Request Card</button>
  </form>
</div>
{% endblock %}
