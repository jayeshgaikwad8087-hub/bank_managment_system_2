{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<div class="flex-center" style="min-height:75vh; flex-direction:column; text-align:center; padding:40px 20px;">
  <div style="font-size:5rem; font-weight:800; background:linear-gradient(135deg,var(--brand),var(--accent)); -webkit-background-clip:text; background-clip:text; color:transparent;">404</div>
  <h2>Page not found</h2>
  <p class="text-muted">The page you're looking for doesn't exist or has moved.</p>
  <a class="btn btn-primary" href="{{ url_for('public.home') }}">Back to Home</a>
</div>
{% endblock %}
