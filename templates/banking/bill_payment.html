{% extends "customer/base_customer.html" %}
{% block page_title %}Bill Payments{% endblock %}
{% block content %}
<div class="glass-card fade-up" style="max-width:440px;">
  <h3 style="margin-top:0;">🧾 Pay a Bill</h3>
  <form method="POST">
    <div class="form-group">
      <label>Pay From</label>
      <select name="account_id" required>
        {% for a in accounts %}<option value="{{ a.id }}">{{ a.masked_number() }} — ₹{{ '%.2f'|format(a.balance) }}</option>{% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>Biller</label>
      <select name="biller" required>
        <option>Electricity Board</option>
        <option>Water Supply</option>
        <option>Mobile Recharge</option>
        <option>Broadband / DTH</option>
        <option>Credit Card Bill</option>
      </select>
    </div>
    <div class="form-group"><label>Amount (₹)</label><input type="number" name="amount" min="1" step="0.01" required></div>
    <button class="btn btn-primary btn-block" type="submit">Pay Bill</button>
  </form>
</div>
{% endblock %}
