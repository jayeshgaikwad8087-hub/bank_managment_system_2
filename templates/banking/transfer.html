{% extends "customer/base_customer.html" %}
{% block page_title %}Fund Transfer{% endblock %}
{% block content %}
<div class="glass-card fade-up" style="max-width:480px;">
  <h3 style="margin-top:0;">🔁 Transfer Money</h3>
  <form method="POST" data-confirm="Confirm this transfer?">
    <div class="form-group">
      <label>From Account</label>
      <select name="from_account_id" required>
        {% for a in accounts %}<option value="{{ a.id }}">{{ a.masked_number() }} — ₹{{ '%.2f'|format(a.balance) }}</option>{% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>To Account Number</label>
      <input type="text" name="to_account_number" list="beneficiary-list" required>
      <datalist id="beneficiary-list">
        {% for b in beneficiaries %}<option value="{{ b.account_number }}">{{ b.nickname }}</option>{% endfor %}
      </datalist>
    </div>
    <div class="form-group"><label>Amount (₹)</label><input type="number" name="amount" min="1" step="0.01" required></div>
    <div class="form-group"><label>Remarks</label><input type="text" name="remarks" placeholder="e.g. Rent, dinner split"></div>
    <button class="btn btn-primary btn-block" type="submit">Send Money</button>
  </form>
</div>
{% endblock %}
