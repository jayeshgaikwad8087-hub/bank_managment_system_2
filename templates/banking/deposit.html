{% extends "customer/base_customer.html" %}
{% block page_title %}Deposit{% endblock %}
{% block content %}
<div class="glass-card fade-up" style="max-width:440px;">
  <h3 style="margin-top:0;">⬇️ Deposit Money</h3>
  <form method="POST">
    <div class="form-group">
      <label>Account</label>
      <select name="account_id" required>
        {% for a in accounts %}<option value="{{ a.id }}">{{ a.masked_number() }} — ₹{{ '%.2f'|format(a.balance) }}</option>{% endfor %}
      </select>
    </div>
    <div class="form-group"><label>Amount (₹)</label><input type="number" name="amount" min="1" step="0.01" required></div>
    <button class="btn btn-primary btn-block" type="submit">Deposit</button>
  </form>
</div>
{% endblock %}
