{% extends "base.html" %}
{% block title %}Contact Us{% endblock %}
{% block content %}
<section class="container" style="padding:60px 24px; max-width:820px;">
  <h1 class="fade-up">Contact Us</h1>
  <div class="glass-card fade-up mt-24">
    <form method='POST' action='#'><div class='form-group'><label>Name</label><input type='text' required></div><div class='form-group'><label>Email</label><input type='email' required></div><div class='form-group'><label>Message</label><textarea rows='4' required></textarea></div><button class='btn btn-primary' type='submit'>Send Message</button></form>
  </div>
</section>
{% endblock %}
