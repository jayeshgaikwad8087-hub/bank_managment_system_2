{% extends "customer/base_customer.html" %}
{% block page_title %}Edit Profile{% endblock %}
{% block content %}
<div class="glass-card fade-up" style="max-width:520px;">
  <form method="POST">
    <div class="form-group"><label>Full Name</label><input type="text" name="full_name" value="{{ user.full_name }}" required></div>
    <div class="form-group"><label>Phone</label><input type="tel" name="phone" value="{{ user.phone }}" required></div>
    <div class="form-group"><label>Address</label><input type="text" name="address" value="{{ customer.address or '' }}"></div>
    <div class="grid grid-2">
      <div class="form-group"><label>City</label><input type="text" name="city" value="{{ customer.city or '' }}"></div>
      <div class="form-group"><label>State</label><input type="text" name="state" value="{{ customer.state or '' }}"></div>
    </div>
    <div class="form-group"><label>Pincode</label><input type="text" name="pincode" value="{{ customer.pincode or '' }}"></div>
    <button class="btn btn-primary btn-block" type="submit">Save Changes</button>
  </form>
</div>
{% endblock %}
