{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="flex-center" style="min-height:80vh; padding:40px 20px;">
  <div class="glass-card fade-up" style="width:100%; max-width:420px;">
    <h2 style="margin-top:0;">Welcome back 👋</h2>
    <p class="text-muted" style="margin-top:-8px;">Log in to your DSG Bank account.</p>
    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="form-group">
        <label>Email or Phone</label>
        <input type="text" name="identifier" required autofocus>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <div class="flex-between mb-16">
        <a href="{{ url_for('auth.forgot_password') }}" class="text-muted" style="font-size:0.85rem;">Forgot password?</a>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Log In</button>
    </form>
    <p class="text-muted mt-16" style="text-align:center; font-size:0.88rem;">
      New to DSG Bank? <a href="{{ url_for('auth.register') }}" style="color:var(--brand); font-weight:600;">Open an account</a>
    </p>
  </div>
</div>
{% endblock %}
