{% extends "base.html" %}
{% block title %}Verify OTP{% endblock %}
{% block content %}
<div class="flex-center" style="min-height:80vh; padding:40px 20px;">
  <div class="glass-card fade-up" style="width:100%; max-width:400px; text-align:center;">
    <h2 style="margin-top:0;">Verify your identity</h2>
    <p class="text-muted">Enter the 6-digit code sent to your registered device.</p>
    <form method="POST">
      <div class="form-group">
        <input type="text" name="otp" maxlength="6" style="text-align:center; letter-spacing:10px; font-size:1.4rem;" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Verify</button>
    </form>
  </div>
</div>
{% endblock %}
