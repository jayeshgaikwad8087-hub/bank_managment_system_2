{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="flex-center" style="min-height:80vh; padding:40px 20px;">
  <div class="glass-card fade-up" style="width:100%; max-width:420px;">
    <h2 style="margin-top:0;">Set a new password</h2>
    <form method="POST">
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="pwd" name="password" oninput="checkPasswordStrength(this, document.getElementById('bar'), document.getElementById('lbl'))" required>
        <div class="password-strength"><div class="password-strength-bar" id="bar"></div></div>
        <div class="input-hint" id="lbl">8+ chars, upper, lower, digit & special character</div>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" name="confirm_password" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Reset Password</button>
    </form>
  </div>
</div>
{% endblock %}
