{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="flex-center" style="min-height:80vh; padding:40px 20px;">
  <div class="glass-card fade-up" style="width:100%; max-width:420px;">
    <h2 style="margin-top:0;">Forgot your password?</h2>
    <p class="text-muted" style="margin-top:-8px;">Enter your registered email and we'll send you a reset link.</p>
    <form method="POST">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required autofocus>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Send Reset Link</button>
    </form>
    <p class="text-muted mt-16" style="text-align:center; font-size:0.88rem;">
      <a href="{{ url_for('auth.login') }}" style="color:var(--brand); font-weight:600;">Back to login</a>
    </p>
  </div>
</div>
{% endblock %}
