{% extends "customer/base_customer.html" %}
{% block page_title %}Apply for Loan{% endblock %}
{% block content %}
<div class="glass-card fade-up" style="max-width:480px;">
  <form method="POST">
    <div class="form-group">
      <label>Loan Type</label>
      <select name="loan_type" required>
        {% for type, rate in rates.items() %}<option value="{{ type }}">{{ type|title }} Loan ({{ rate }}% p.a.)</option>{% endfor %}
      </select>
    </div>
    <div class="form-group"><label>Loan Amount (₹)</label><input type="number" id="principal" name="principal" min="5000" required></div>
    <div class="form-group"><label>Tenure (months)</label><input type="number" id="tenure" name="tenure" min="3" max="360" value="24" required></div>
    <div class="form-group"><label>Purpose</label><textarea name="purpose" rows="3"></textarea></div>
    <button class="btn btn-primary btn-block" type="submit">Submit Application</button>
  </form>
</div>
{% endblock %}
